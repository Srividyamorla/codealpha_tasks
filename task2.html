<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nuvvu Naaku Nachav Music Player</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.player {
    width: 380px;
    background: #111;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
}

h2 {
    text-align: center;
    margin: 5px 0;
}

.movie {
    text-align: center;
    color: #1db954;
    margin-bottom: 10px;
}

input[type="file"] {
    width: 100%;
    margin-bottom: 10px;
}

.song-info {
    text-align: center;
    margin: 10px 0;
}

.progress-container {
    height: 6px;
    background: #333;
    border-radius: 5px;
    cursor: pointer;
}

.progress {
    height: 100%;
    width: 0%;
    background: #1db954;
}

.time {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #aaa;
}

.controls {
    display: flex;
    justify-content: space-around;
    margin: 15px 0;
}

.controls button {
    background: none;
    border: none;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.controls button:hover {
    color: #1db954;
}

.volume {
    margin-top: 10px;
}

.playlist {
    margin-top: 15px;
    max-height: 150px;
    overflow-y: auto;
}

.playlist div {
    padding: 8px;
    cursor: pointer;
    border-bottom: 1px solid #333;
    font-size: 14px;
}

.playlist div.active {
    background: #1db954;
}
</style>
</head>

<body>

<div class="player">
    <h2>🎵 Telugu Music Player</h2>
    <div class="movie">🎬 Nuvvu Naaku Nachav</div>

    <!-- SELECT SONGS -->
    <input type="file" id="fileInput" accept="audio/*" multiple>

    <div class="song-info">
        <p id="songName">Select movie songs</p>
    </div>

    <div class="progress-container" id="progressContainer">
        <div class="progress" id="progress"></div>
    </div>

    <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <button onclick="prevSong()">⏮</button>
        <button onclick="playSong()">▶</button>
        <button onclick="pauseSong()">⏸</button>
        <button onclick="nextSong()">⏭</button>
    </div>

    <div class="volume">
        Volume
        <input type="range" min="0" max="1" step="0.01" value="1" id="volume">
    </div>

    <div class="playlist" id="playlist"></div>

    <audio id="audio"></audio>
</div>

<script>
let songs = [];
let currentIndex = 0;

const fileInput = document.getElementById("fileInput");
const audio = document.getElementById("audio");
const songName = document.getElementById("songName");
const progress = document.getElementById("progress");
const progressContainer = document.getElementById("progressContainer");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");
const volume = document.getElementById("volume");
const playlist = document.getElementById("playlist");

// Load selected songs
fileInput.addEventListener("change", () => {
    songs = Array.from(fileInput.files);
    currentIndex = 0;
    loadSong();
    updatePlaylist();
});

// Load song
function loadSong() {
    if (!songs.length) return;
    audio.src = URL.createObjectURL(songs[currentIndex]);
    songName.innerText = songs[currentIndex].name;
}

// Play
function playSong() {
    if (!songs.length) return;
    audio.play();
}

// Pause
function pauseSong() {
    audio.pause();
}

// Next
function nextSong() {
    if (!songs.length) return;
    currentIndex = (currentIndex + 1) % songs.length;
    loadSong();
    audio.play();
    updatePlaylist();
}

// Previous
function prevSong() {
    if (!songs.length) return;
    currentIndex = (currentIndex - 1 + songs.length) % songs.length;
    loadSong();
    audio.play();
    updatePlaylist();
}

// Progress update
audio.addEventListener("timeupdate", () => {
    progress.style.width = (audio.currentTime / audio.duration) * 100 + "%";
    currentTimeEl.innerText = formatTime(audio.currentTime);
    durationEl.innerText = formatTime(audio.duration);
});

// Seek
progressContainer.addEventListener("click", e => {
    audio.currentTime =
        (e.offsetX / progressContainer.clientWidth) * audio.duration;
});

// Volume
volume.addEventListener("input", () => {
    audio.volume = volume.value;
});

// Autoplay next
audio.addEventListener("ended", nextSong);

// Playlist UI
function updatePlaylist() {
    playlist.innerHTML = "";
    songs.forEach((song, i) => {
        const div = document.createElement("div");
        div.innerText = song.name;
        if (i === currentIndex) div.classList.add("active");
        div.onclick = () => {
            currentIndex = i;
            loadSong();
            audio.play();
            updatePlaylist();
        };
        playlist.appendChild(div);
    });
}

// Time format
function formatTime(t) {
    if (isNaN(t)) return "0:00";
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
}
</script>

</body>
</html>
